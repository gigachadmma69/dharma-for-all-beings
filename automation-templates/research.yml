name: Source research and archive check
on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'
  push:
    branches: [main]
    paths: ['archive.json', 'scripts/**', '.github/workflows/research.yml']
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build portable library
        run: python3 scripts/build.py
      - name: Check sources and discover reading candidates
        run: python3 scripts/research.py
      - uses: actions/upload-artifact@v4
        with:
          name: source-research-and-library
          path: |
            research-report.json
            dist/
          retention-days: 30
